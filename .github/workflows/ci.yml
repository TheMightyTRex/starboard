name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: No private details
        run: tools/check-private.sh
      - name: Shell scripts parse
        run: bash -n install.sh && bash -n update.sh && bash -n tools/check-private.sh
      - name: Header is up to date in every page
        run: python tools/apply_shell.py && git diff --exit-code web/
      - name: Docker image builds
        run: docker build -t starboard:ci .
      - name: Image starts even when the checkout is private to its owner
        run: |
          chmod -R go-rwx starboard web VERSION
          docker build -t starboard:perm .
          docker run -d --name perm --read-only --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001,mode=0700 -p 127.0.0.1:18095:8095 starboard:perm
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:18095/healthz && exit 0; sleep 2; done
          docker logs perm; exit 1
