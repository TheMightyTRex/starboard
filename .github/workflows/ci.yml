name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: No private details
        run: tools/check-private.sh
      - name: Shell scripts parse
        run: bash -n install.sh && bash -n update.sh && bash -n tools/check-private.sh
      - name: Header is up to date in every page
        run: python tools/apply_shell.py && git diff --exit-code web/
      - name: Docker image builds
        run: docker build -t starboard:ci .
