name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tests
        run: python tools/run-tests.py -j 4 -v
      - name: API and plug-in checks (description and reference up to date, contract tests, plug-in tests, DASH-281)
        run: bash tools/check-api.sh
      - name: No private details
        run: tools/check-private.sh
      - name: Shell scripts parse
        run: bash -n install.sh && bash -n update.sh && bash -n tools/check-private.sh
      - name: Header is up to date in every page
        run: python tools/apply_shell.py && git diff --exit-code web/
      - name: Docker image builds
        run: docker build -t starboard:ci .
      - name: Image starts even when the checkout is private to its owner
        run: |
          chmod -R go-rwx starboard web VERSION
          docker build -t starboard:perm .
          docker run -d --name perm --read-only --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001,mode=0700 -p 127.0.0.1:18095:8095 starboard:perm
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:18095/healthz && exit 0; sleep 2; done
          docker logs perm; exit 1
  oasdiff:
    # Public API changes that break an outside tool fail here (DASH-603). The baseline is the last release tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install oasdiff 1.41.0 (checked against its published checksum)
        run: |
          curl -fsSL -o oasdiff.tar.gz https://github.com/oasdiff/oasdiff/releases/download/v1.41.0/oasdiff_1.41.0_linux_amd64.tar.gz
          echo "96365453163118e6503eb71742643d9ee67f91aedbaadd1a1ce9c6213e3b71c7  oasdiff.tar.gz" | sha256sum -c -
          tar -xzf oasdiff.tar.gz oasdiff
          sudo install -m 0755 oasdiff /usr/local/bin/oasdiff
      - name: No breaking change to the public API since the last release
        run: OASDIFF=required bash tools/oasdiff-check.sh
