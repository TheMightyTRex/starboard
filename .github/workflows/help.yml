name: Help centre
# Builds the help centre's web pages from docs/help with the design system's help centre builder
# (tools/help_centre in TheMightyTRex/design-system, settings in help-centre.json) and publishes them on GitHub Pages:
# https://themightytrex.github.io/starboard/help/
on:
  push:
    branches: [main]
    paths:
      - "docs/help/**"
      - "help-centre.json"
      - ".github/workflows/help.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check the help
        run: python tools/check-help.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: TheMightyTRex/design-system
          path: _design-system
          persist-credentials: false
      - name: Build the pages
        run: |
          pip install markdown==3.7 pymdown-extensions==10.9
          python _design-system/tools/help_centre/build.py --config help-centre.json --out _site --strict
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}help/
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
