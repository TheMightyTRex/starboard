name: Code and writing checks
# The occasional checks (owner, 17 November 2026: "only every now and then, not every release"): once a week, and
# whenever someone runs it by hand (Actions, Code and writing checks, Run workflow). Not on every push or release.
#   checks    Ruff, Biome, Vale, typos, actionlint and zizmor (tools/checks.sh)
#   coverage  the unit tests under coverage.py; fails below the floor in .coveragerc
on:
  schedule:
    - cron: "0 4 * * 1"  # Mondays at 04:00 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Ruff, Biome, Vale, typos, actionlint and zizmor
        run: bash tools/checks.sh
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Unit tests under coverage.py
        run: |
          python -m pip install --quiet coverage==7.17.3
          python -m coverage run -m unittest discover -s tests
          python -m coverage report
