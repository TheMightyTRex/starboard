<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Authors · Books · Library · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<link rel="stylesheet" href="/css/media.css">
<link rel="stylesheet" href="/css/library.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/library-groups.js" defer></script>
</head>
<body class="page-library with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page media lib" data-library-groups="books" data-by="authors">
  <div class="page-head">
    <div class="page-head__text"><h1>Authors</h1><p class="page-head__summary">Ebooks grouped by author.</p></div>
  </div>
  <div class="toolbar">
    <div class="toolbar__row">
      <form class="toolbar__search search-field" id="groups-search" role="search">
        <label class="visually-hidden" for="groups-q">Search authors</label>
        <input class="input" id="groups-q" type="search" autocomplete="off" placeholder="Search authors">
      </form>
      <div class="toolbar__end"><span class="toolbar__count" id="groups-count" aria-live="polite"></span></div>
    </div>
  </div>
  <nav class="az-jump" id="lib-az" aria-label="Jump to letter" hidden><ol></ol></nav>
  <h2 class="visually-hidden" id="groups-h">Authors</h2>
  <div id="groups" class="lib-wall" aria-busy="true" aria-labelledby="groups-h"><p class="muted">Reading your library…</p></div>
</div>
</main>
</body>
</html>
