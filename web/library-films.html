<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Films · Library · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<link rel="stylesheet" href="/css/media.css">
<link rel="stylesheet" href="/css/library.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/find-wanted.js" defer></script>
<script src="/js/library.js" defer></script>
</head>
<body class="page-library with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page media lib" data-library="films">
  <div class="page-head">
    <div class="page-head__text"><h1>Films</h1><p class="page-head__summary">Every film in your library, A to Z.</p></div>
    <div class="actions" id="lib-actions"><a class="btn btn--quiet" href="/bring-in.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 9V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1"/><path d="M2 13h10"/><path d="m9 16 3-3-3-3"/></svg>Bring in media</a><button class="btn btn--quiet" type="button" id="lib-save" hidden>Save this view as default</button></div>
  </div>
  <div class="lib-group-head" id="lib-group" hidden></div>
  <div class="toolbar">
    <div class="toolbar__row">
      <form class="toolbar__search search-field" id="lib-search" role="search">
        <label class="visually-hidden" for="lib-q">Search your films</label>
        <input class="input" id="lib-q" name="q" type="search" autocomplete="off" placeholder="Search your films">
      </form>
      <div class="filter-chips" id="lib-chips" role="group" aria-label="Show only" hidden></div>
      <div class="toolbar__end">
        <div class="field lib-field"><label class="visually-hidden" for="lib-sort">Sort</label>
          <select class="select" id="lib-sort"><option value="az">A to Z</option><option value="added">Recently added</option><option value="year">Year</option></select></div>
        <div class="segmented" role="radiogroup" aria-label="Show as">
          <label><input type="radio" name="lib-layout" value="covers" checked><span>Covers</span></label>
          <label><input type="radio" name="lib-layout" value="list"><span>List</span></label>
        </div>
        <div class="field lib-field" id="lib-size-field"><label class="visually-hidden" for="lib-size">Cover size</label>
          <select class="select" id="lib-size"><option value="small">Small covers</option><option value="medium">Medium covers</option><option value="large">Large covers</option></select></div>
        <span class="toolbar__count" id="lib-count" aria-live="polite"></span>
      </div>
    </div>
  </div>
  <nav class="az-jump" id="lib-az" aria-label="Jump to letter" hidden><ol></ol></nav>
  <div id="lib-notice"></div>
  <div class="load-more lib-earlier" id="lib-earlier" hidden><button class="btn" type="button">Show earlier titles</button></div>
  <div id="lib-wall" class="lib-wall" aria-busy="true" aria-label="Films"><p class="muted">Reading your library…</p></div>
  <div class="load-more" id="lib-more" hidden><span class="load-more__count" id="lib-more-count"></span><button class="btn" type="button">Show 40 more</button></div>
</div>
</main>
</body>
</html>
