<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page page--settings">
  <div class="page-head">
    <div class="page-head__text">
      <h1>Manage apps</h1>
      <p class="page-head__summary" id="apps-summary">The apps on your dashboard, in the order they appear.</p>
    </div>
    <div class="actions"><button type="button" class="btn" id="find-apps"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-search"/></svg>Search for new apps</button><a class="btn" href="/install-apps.html"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-download"/></svg>Install apps</a><a class="btn" href="/copy-settings.html"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-copy"/></svg>Copy app settings</a></div>
  </div>
  <div class="settings-sections" id="app-sections" aria-busy="true"></div>
  <div class="actions"><button type="button" class="btn btn--primary" id="add-service"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-plus"/></svg>Add an app</button></div>
  <section class="settings-section" id="usenet-section" aria-labelledby="usenet-h">
    <div class="settings-section__head"><h2 id="usenet-h">Usenet providers</h2><p class="small muted">For SABnzbd, which downloads from Usenet.</p></div>
  </section>
</div>
</main>
