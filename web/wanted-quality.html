<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Below the quality wanted · Wanted · Activity · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<body class="page-placeholder with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page" data-wanted="cutoff">
  <div class="page-head">
    <div class="page-head__text"><h1>Below the quality wanted</h1><p class="page-head__summary" id="wanted-summary">What Reelix has, but not yet at the quality you want.</p></div>
    <div class="actions">
      <button type="button" class="btn" id="wanted-all"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-search"/></svg>Search all</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="toolbar__row">
      <fieldset class="segmented"><legend class="visually-hidden">Show</legend>
        <label><input type="radio" name="wanted-kind" value="movie" checked><span>Films</span></label>
        <label><input type="radio" name="wanted-kind" value="episode"><span>Episodes</span></label>
      </fieldset>
      <button type="button" class="btn" id="wanted-ticked" disabled><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-search"/></svg><span>Search for the ticked ones</span></button>
    </div>
  </div>
  <h2 class="visually-hidden" id="wanted-list-h">Wanted: under the quality wanted</h2>
  <ul class="rows" id="wanted-list" aria-labelledby="wanted-list-h"></ul>
  <div class="actions"><button type="button" class="btn" id="wanted-more" hidden>Show more</button></div>
</div>
</main>
</body>
</html>
