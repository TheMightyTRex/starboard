<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Issues · Requests · Activity · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/issues.js" defer></script>
</head>
<body class="page-other-services with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page">
  <div class="page-head">
    <div class="page-head__text">
      <h1>Issues</h1>
      <p class="page-head__summary" id="issues-summary">Reading issues…</p>
    </div>
  </div>
  <div class="toolbar">
    <div class="toolbar__row">
      <fieldset class="segmented" id="issues-filters"><legend class="visually-hidden">Show</legend>
        <label for="issues-show-all"><input type="radio" name="issues-show" id="issues-show-all" value="all"><span>All</span></label>
        <label for="issues-show-open"><input type="radio" name="issues-show" id="issues-show-open" value="open" checked><span>Open</span></label>
        <label for="issues-show-resolved"><input type="radio" name="issues-show" id="issues-show-resolved" value="resolved"><span>Resolved</span></label>
      </fieldset>
    </div>
  </div>
  <h2 class="visually-hidden" id="issues-h">Downloads that need attention</h2>
  <ul class="rows" id="issues" aria-labelledby="issues-h"></ul>
</div>
</main>
</body>
</html>
