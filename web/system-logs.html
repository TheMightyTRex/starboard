<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Logs · System · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<link rel="stylesheet" href="/css/settings.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/system-logs.js" defer></script>
<script src="/js/app-logs.js" defer></script>
<script src="/js/reelix-system.js" defer></script>
</head>
<body class="page-system-backup with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page">
  <div class="page-head">
    <div class="page-head__text"><h1>Logs</h1><p class="page-head__summary" id="logs-summary">What Starboard did, and every problem it met.</p></div>
    <div class="actions" id="logs-actions"></div>
  </div>
  <div id="logs-notice"></div>
  <section class="panel" aria-labelledby="report-h">
    <div class="panel__head"><h2 id="report-h">Report a problem</h2></div>
    <div class="stack-4" id="report"></div>
  </section>
  <section class="panel" aria-labelledby="entries-h">
    <div class="panel__head"><h2 id="entries-h">Log</h2><span class="small muted" id="entries-count"></span></div>
    <div class="toolbar" id="logs-toolbar"></div>
    <div id="entries" aria-busy="true"></div>
  </section>
  <section class="panel" aria-labelledby="applogs-h" id="applogs" hidden>
    <div class="panel__head"><h2 id="applogs-h">App logs</h2><span class="small muted">The latest lines from each app, with keys, passwords and addresses hidden</span></div>
    <div class="stack-4" id="applogs-body"></div>
  </section>
</div>
</main>
</body>
</html>
