<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Requests · Downloads · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/requests.js" defer></script>
</head>
<body class="page-other-services with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page">
  <div class="page-head">
    <div class="page-head__text">
      <h1>Requests</h1>
      <p class="page-head__summary" id="requests-summary">Loading requests…</p>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="requests-refresh"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-refresh-cw"/></svg>Check now</button>
      <a class="btn btn--quiet" id="requests-open" target="_blank" rel="noopener noreferrer" hidden><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-external-link"/></svg><span>Open Seerr</span><span class="visually-hidden"> (opens in a new tab)</span></a>
    </div>
  </div>
  <div class="toolbar">
    <div class="toolbar__row">
      <fieldset class="segmented" id="requests-filters"><legend class="visually-hidden">Show</legend>
        <label for="requests-show-all"><input type="radio" name="requests-show" id="requests-show-all" value="all"><span>All recent</span></label>
        <label for="requests-show-pending"><input type="radio" name="requests-show" id="requests-show-pending" value="pending" checked><span>Waiting for approval</span></label>
      </fieldset>
    </div>
  </div>
  <div id="requests-notice"></div>
  <ul class="rows" id="requests"></ul>
</div>
</main>
</body>
</html>
