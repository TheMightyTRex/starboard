<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Apps · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<link rel="stylesheet" href="/css/apps.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/app-details.js" defer></script>
<script src="/js/apps.js" defer></script>
</head>
<body class="page-apps with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page">
  <div class="page-head">
    <div class="page-head__text">
      <h1>Apps</h1>
      <p class="page-head__summary" id="apps-summary">Checking your apps…</p>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="check-now"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-refresh-cw"/></svg>Check now</button>
      <a class="btn btn--quiet" href="/settings.html"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-app-window"/></svg>Manage apps</a>
    </div>
  </div>
  <div id="setup-left" hidden></div>
  <div id="attention" class="stack-2" hidden></div>
  <div class="toolbar" id="apps-toolbar" hidden>
    <div class="toolbar__row">
      <div class="toolbar__search"><input class="input" id="app-filter" type="search" aria-label="Filter apps by name" placeholder="Filter apps by name" autocomplete="off"></div>
      <div class="filter-chips" id="app-filters" role="group" aria-label="Show only" hidden></div>
      <div class="toolbar__end"><span class="toolbar__count" id="apps-count"></span></div>
    </div>
  </div>
  <div class="app-groups" id="app-groups"></div>
  <div id="apps-empty" hidden></div>
</div>
</main>
</body>
</html>
