<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Coming up · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<link rel="stylesheet" href="/css/media.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/upcoming.js" defer></script>
</head>
<body class="page-upcoming media with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page">
  <div class="page-head">
    <div class="page-head__text">
      <h1>Coming up</h1>
      <p class="page-head__summary summary" id="calendar-summary">Loading the next two weeks…</p>
    </div>
    <div class="actions"><button type="button" class="btn btn--quiet" id="calendar-feed"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-calendar-clock"/></svg>Add to your calendar</button><a class="btn btn--quiet" href="/settings-general-lists.html#coming-up"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-settings"/></svg>Change how far ahead</a></div>
  </div>
  <div class="toolbar">
    <div class="toolbar__row">
      <div class="filter-chips" id="status-filters" role="group" aria-label="Show only"></div>
      <div class="filter-chips" id="app-filters" role="group" aria-label="Apps"></div>
      <div class="toolbar__end">
        <fieldset class="segmented" id="view">
          <legend class="visually-hidden">View</legend>
          <label><input type="radio" name="view" value="list"><span><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-list"/></svg>List</span></label>
          <label><input type="radio" name="view" value="calendar"><span><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-calendar-days"/></svg>Calendar</span></label>
        </fieldset>
        <p class="toolbar__count" id="calendar-count"></p>
      </div>
    </div>
  </div>
  <div id="calendar-errors"></div>
  <div id="calendar"></div>
</div>
</main>
</body>
</html>
