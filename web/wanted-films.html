<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Films · Wanted · Activity · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<link rel="stylesheet" href="/css/media.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/find-wanted.js" defer></script>
<script src="/js/wanted.js" defer></script>
</head>
<body class="page-placeholder with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page" data-wanted="missing" data-wanted-kind="movie">
  <div class="page-head">
    <div class="page-head__text"><h1>Films</h1><p class="page-head__summary" id="wanted-summary">Everything Reelix follows but does not have yet.</p></div>
    <div class="actions">
      <button type="button" class="btn" id="wanted-all"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-search"/></svg>Find all wanted</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="toolbar__row">
      <label class="check dl-select-all" hidden><input type="checkbox" id="select-all"><span class="check__text">Select all</span></label>
    </div>
  </div>
  <h2 class="visually-hidden" id="wanted-list-h">Wanted films</h2>
  <ul class="rows" id="wanted-list" aria-labelledby="wanted-list-h"></ul>
  <div class="selection-bar" id="selection-bar" role="region" aria-label="Selected on this list" hidden>
    <span class="selection-bar__text" id="selection-text"></span>
    <div class="actions" id="selection-actions"></div>
  </div>
  <div class="actions"><button type="button" class="btn" id="wanted-more" hidden>Show more</button></div>
</div>
</main>
</body>
</html>
