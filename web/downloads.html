<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Downloads · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<link rel="stylesheet" href="/css/media.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/downloads.js" defer></script>
</head>
<body class="page-downloads media with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page">
  <div class="page-head">
    <div class="page-head__text">
      <h1>Downloads</h1>
      <p class="page-head__summary summary" id="queue-summary">Loading the queue…</p>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="auto-refresh" aria-pressed="false"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-pause"/></svg>Pause updates</button>
      <button type="button" class="btn" id="refresh"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-refresh-cw"/></svg>Check now</button>
      <button type="button" class="btn" id="copy-issues"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-copy"/></svg>Copy issues for an AI helper</button>
      <button type="button" class="btn" id="download-issues"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-download"/></svg>Download as Markdown</button>
    </div>
  </div>
  <div id="issues-export" tabindex="-1" hidden></div>
  <div class="stats" id="transfer" hidden></div>
  <section class="panel" id="schedule" aria-labelledby="schedule-h" hidden>
    <div class="panel__head">
      <h2 id="schedule-h">Download hours</h2>
      <span id="schedule-chip"></span>
    </div>
    <p id="schedule-text"></p>
    <div class="actions" id="schedule-actions"></div>
  </section>
  <div class="toolbar">
    <div class="toolbar__row">
      <label class="check dl-select-all" hidden><input type="checkbox" id="select-all"><span class="check__text">Select all</span></label>
      <div class="filter-chips" id="queue-filters" role="group" aria-label="Show only"></div>
      <div class="toolbar__end">
        <div class="menu-wrap" id="sort-wrap">
          <button type="button" class="btn" id="sort-button" aria-haspopup="menu" aria-controls="sort-menu"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-arrow-up-down"/></svg><span id="sort-label">Sort: Needs you first</span><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-chevron-down"/></svg></button>
          <div class="menu" id="sort-menu" role="menu" aria-label="Sort" hidden>
            <button type="button" role="menuitemradio" aria-checked="true" data-sort="attention">Needs you first</button>
            <button type="button" role="menuitemradio" aria-checked="false" data-sort="time">Time left</button>
            <button type="button" role="menuitemradio" aria-checked="false" data-sort="title">Name</button>
            <button type="button" role="menuitemradio" aria-checked="false" data-sort="queue">Queue order</button>
          </div>
        </div>
        <button type="button" class="btn" id="group-by-app" aria-pressed="false"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-layers"/></svg>Group by app</button>
        <span class="toolbar__count" id="queue-count"></span>
      </div>
    </div>
  </div>
  <div id="queue-errors"></div>
  <div id="queue" aria-label="Queue"></div>
  <div class="selection-bar" id="selection-bar" role="region" aria-label="Selected downloads" hidden>
    <span class="selection-bar__text" id="selection-text"></span>
    <div class="actions" id="selection-actions"></div>
  </div>
  <section class="media-section" id="held-section" aria-labelledby="held-h" hidden>
    <h2 class="group-heading" id="held-h" tabindex="-1">Held downloads</h2>
    <p class="small muted" id="held-summary"></p>
    <ul class="rows" id="held" aria-labelledby="held-h"></ul>
  </section>
  <section class="media-section" id="recent-section" aria-labelledby="recent-h" hidden>
    <h2 class="group-heading" id="recent-h">Finished this week</h2>
    <p class="small muted" id="recent-summary"></p>
    <ul class="rows" id="recent"></ul>
  </section>
</div>
</main>
</body>
</html>
