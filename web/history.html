<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>History · Activity · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/history.js" defer></script>
</head>
<body class="page-placeholder with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page">
  <div class="page-head">
    <div class="page-head__text"><h1>History</h1><p class="page-head__summary" id="history-summary">What Reelix found, downloaded, renamed and removed, newest first.</p></div>
  </div>
  <div class="toolbar">
    <div class="toolbar__row">
      <fieldset class="segmented" id="history-filters"><legend class="visually-hidden">Show</legend>
        <label for="history-show-all"><input type="radio" name="history-show" id="history-show-all" value="all" checked><span>Everything</span></label>
        <label for="history-show-grabbed"><input type="radio" name="history-show" id="history-show-grabbed" value="grabbed"><span>Sent to download</span></label>
        <label for="history-show-imported"><input type="radio" name="history-show" id="history-show-imported" value="imported"><span>Added to your library</span></label>
        <label for="history-show-failed"><input type="radio" name="history-show" id="history-show-failed" value="failed"><span>Failed</span></label>
        <label for="history-show-refused"><input type="radio" name="history-show" id="history-show-refused" value="refused"><span>Refused list</span></label>
      </fieldset>
    </div>
  </div>
  <h2 class="visually-hidden" id="history-list-h">Everything that happened, newest first</h2>
  <ul class="rows" id="history-list" aria-labelledby="history-list-h"></ul>
  <div class="actions"><button type="button" class="btn" id="history-more" hidden>Show more</button></div>
</div>
</main>
</body>
</html>
