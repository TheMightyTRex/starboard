<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Search · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<link rel="stylesheet" href="/css/media.css">
<link rel="stylesheet" href="/css/library.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/search.js" defer></script>
<script src="/js/add-panel.js" defer></script>
<script src="/js/library-search.js" defer></script>
</head>
<body class="page-search media with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page">
  <div class="page-head">
    <div class="page-head__text">
      <h1>Search</h1>
      <p class="page-head__summary summary" id="search-summary">Your library first, then what Reelix can add.</p>
    </div>
  </div>
  <div class="toolbar">
    <div class="toolbar__row">
      <form class="toolbar__search search-field" id="search-form" role="search">
        <label class="visually-hidden" for="q">Search for</label>
        <input class="input" id="q" name="q" type="search" autocomplete="off" placeholder="For example: Blue Planet, Dune, Björk">
      </form>
      <div class="filter-chips" id="kind-filters" role="group" aria-label="Show only" hidden></div>
      <div class="toolbar__end"><span class="toolbar__count" id="search-count"></span></div>
    </div>
  </div>
  <div id="search-errors"></div>
  <div class="stack-4" id="lib-start" hidden></div>
  <section class="media-section" id="lib-found" aria-labelledby="found-h" hidden></section>
  <section class="media-section" id="lookup" aria-busy="false" hidden></section>
  <section class="media-section" id="results-section" aria-labelledby="results-h" aria-busy="false" hidden>
    <h2 id="results-h">Results</h2>
    <ul class="rows" id="results"></ul>
  </section>
  <p class="small" id="radio-search" hidden></p>
  <p class="small muted" id="search-more" hidden>Not finding it? <a href="/settings.html">Add another app to search</a>.</p>
</div>
</main>
</body>
</html>
