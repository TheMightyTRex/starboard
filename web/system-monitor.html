<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Monitor · System · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<link rel="stylesheet" href="/css/system.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/charts.js" defer></script>
<script src="/js/system-monitor.js" defer></script>
</head>
<body class="page-system-monitor with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page">
  <div class="page-head">
    <div class="page-head__text"><h1>Monitor</h1><p class="page-head__summary" id="monitor-summary">Live while this page is open · every 2 seconds · last 3 minutes</p></div>
    <div class="actions"><button type="button" class="btn" id="pause" aria-pressed="false"></button></div>
  </div>
  <p class="small muted" id="monitor-machine"></p>
  <div class="sys-charts" id="charts"></div>
  <section class="panel" id="apps-panel" aria-labelledby="apps-title" hidden>
    <div class="panel__head"><h2 id="apps-title">Apps</h2><span class="small muted" id="apps-detail">The 12 busiest, now</span></div>
    <div id="apps-use"></div>
  </section>
  <section class="panel" aria-labelledby="threads-title">
    <div class="panel__head"><h2 id="threads-title">Processor threads</h2><span class="small muted" id="threads-detail">Starting</span></div>
    <ul class="meter-list meter-list--threads" id="threads"></ul>
  </section>
</div>
</main>
</body>
</html>
