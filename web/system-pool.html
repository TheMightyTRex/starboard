<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Pool · System · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<link rel="stylesheet" href="/css/system.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/system-pool.js" defer></script>
</head>
<body class="page-system-pool with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page">
  <div class="page-head">
    <div class="page-head__text"><h1 id="pool-title">Pool</h1><p class="page-head__summary" id="pool-summary">Loading</p></div>
    <div class="actions" id="pool-actions" hidden>
      <button type="button" class="btn btn--primary" id="add-drive"></button>
      <button type="button" class="btn" id="balance"></button>
    </div>
  </div>
  <div id="pool-notice"></div>
  <div id="overview" class="stack-4">
    <div class="stats" id="pool-stats"></div>
    <section class="panel" id="in-pool-panel" aria-labelledby="in-pool-title" hidden>
      <div class="panel__head"><h2 id="in-pool-title">Disks in the pool</h2><span class="small muted">New files go to the disk with the most free space</span></div>
      <div id="in-pool"></div>
    </section>
    <section class="panel" id="backup-panel" aria-labelledby="backup-title" hidden>
      <div class="panel__head"><h2 id="backup-title">Backup disks</h2><span class="small muted">Not part of the pool: they protect it</span></div>
      <ul class="rows" id="backups"></ul>
    </section>
    <section class="panel" id="spare-panel" aria-labelledby="spare-title" hidden>
      <div class="panel__head"><h2 id="spare-title">Other disks</h2><span class="small muted">From the pool helper, read when this page opened</span></div>
      <ul class="rows" id="spare"></ul>
    </section>
    <section class="panel" id="job-panel" aria-labelledby="job-title" hidden>
      <div class="panel__head"><h2 id="job-title">Last change</h2><span class="small muted" id="job-when"></span></div>
      <div id="job"></div>
    </section>
  </div>
  <section id="wizard" aria-labelledby="wizard-title" hidden>
    <h2 class="visually-hidden" id="wizard-title">Steps</h2>
    <div class="meter wizard-progress"><div class="meter__label"><span id="wizard-where"></span><span class="numeric" id="wizard-left"></span></div>
      <div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="1" id="wizard-bar"><span></span></div></div>
    <ol class="steps steps--sub" aria-label="Steps" id="wizard-steps"></ol>
    <div class="wizard"><div class="stack-4" id="wizard-body"></div><div class="wizard__foot" id="wizard-foot"></div></div>
  </section>
</div>
</main>
</body>
</html>
