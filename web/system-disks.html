<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Disk health · System · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<link rel="stylesheet" href="/css/system.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/charts.js" defer></script>
<script src="/js/system-disks.js" defer></script>
</head>
<body class="page-system-disks with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page">
  <div class="page-head">
    <div class="page-head__text"><h1>Disk health</h1><p class="page-head__summary" id="disks-summary">Loading</p></div>
    <div class="actions"><button type="button" class="btn" id="read-now" hidden><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-hard-drive"/></svg><span>Read disks now</span></button><button type="button" class="btn" id="refresh"></button></div>
  </div>
  <div class="stats" id="disk-stats"></div>
  <div id="disks"></div>
  <div class="sys-meters" id="disk-meters"></div>
  <section class="panel" id="events-panel" aria-labelledby="events-title" hidden>
    <div class="panel__head"><h2 id="events-title">Recent events</h2><span class="small muted">Self-tests and changes, newest first</span></div>
    <ul class="rows" id="events"></ul>
  </section>
</div>
</main>
</body>
</html>
