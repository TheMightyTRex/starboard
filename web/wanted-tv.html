<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>TV · Wanted · Activity · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/wanted.js" defer></script>
</head>
<body class="page-placeholder with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page" data-wanted="missing" data-wanted-kind="episode">
  <div class="page-head">
    <div class="page-head__text"><h1>TV</h1><p class="page-head__summary" id="wanted-summary">Everything Reelix follows but does not have yet.</p></div>
    <div class="actions">
      <button type="button" class="btn btn--quiet" id="wanted-select" aria-pressed="false"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-list-checks"/></svg>Select several</button>
      <button type="button" class="btn" id="wanted-all"><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-search"/></svg>Search all</button>
    </div>
  </div>
  <h2 class="visually-hidden" id="wanted-list-h">Wanted TV</h2>
  <ul class="rows" id="wanted-list" aria-labelledby="wanted-list-h"></ul>
  <div class="selection-bar" id="wanted-bar" role="region" aria-label="Search for several" hidden>
    <span class="selection-bar__text" id="wanted-bar-count" aria-live="polite">Tick the ones to search for</span>
    <button type="button" class="btn" id="wanted-ticked" disabled><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-search"/></svg><span>Search for them</span></button>
    <button type="button" class="btn btn--quiet" id="wanted-done">Done</button>
  </div>
  <div class="actions"><button type="button" class="btn" id="wanted-more" hidden>Show more</button></div>
</div>
</main>
</body>
</html>
