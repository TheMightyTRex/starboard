 stroke-dasharray="5 3" rx="3"/><text x="515.0" y="448.125" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">B</text><text x="515.0" y="482" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">Disk 4</text><text x="515.0" y="500" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5068">22% full</text><text x="20" y="540" font-size="14" font-weight="400" text-anchor="start" fill="#1d2238">Each letter is one whole folder, such as a series.</text><text x="20" y="560" font-size="14" font-weight="400" text-anchor="start" fill="#1d2238">Dashed folders were moved. Each stays whole on one drive.</text></g></svg>
