<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" role="img" aria-labelledby="t d"><title id="t">Balancing the files across the drives in a pool</title><desc id="d">Before: disk 1 is 85% full with folders A, B, C and D, disk 2 is 48% full, disk 3 is 18% full and disk 4 is empty. After: folder B has moved to disk 4 and folder C to disk 3, so each disk is between 22% and 48% full, and every folder is still whole on one drive.</desc><rect width="640" height="580" fill="#ffffff"/><g font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" fill="#1d2238"><text x="20" y="30" font-size="18" font-weight="700" text-anchor="start" fill="#1d2238">Before balancing</text><text x="20" y="290" font-size="18" font-weight="700" text-anchor="start" fill="#1d2238">After balancing</text><rect x="20" y="50" width="90" height="150" fill="none" stroke="#7d86a8" stroke-width="2" rx="6"/><rect x="26" y="163.5" width="78" height="35.5" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="65.0" y="186.25" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">A</text><rect x="26" y="129.8" width="78" height="31.8" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="65.0" y="150.625" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">B</text><rect x="26" y="99.8" width="78" height="28.0" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="65.0" y="118.75" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">C</text><rect x="26" y="73.5" width="78" height="24.2" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="65.0" y="90.625" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">D</text><text x="65.0" y="222" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">Disk 1</text><text x="65.0" y="240" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5068">85% full</text><rect x="170" y="50" width="90" height="150" fill="none" stroke="#7d86a8" stroke-width="2" rx="6"/><rect x="176" y="163.5" width="78" height="35.5" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="215.0" y="186.25" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">E</text><rect x="176" y="129.8" width="78" height="31.8" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="215.0" y="150.625" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">F</text><text x="215.0" y="222" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">Disk 2</text><text x="215.0" y="240" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5068">48% full</text><rect x="320" y="50" width="90" height="150" fill="none" stroke="#7d86a8" stroke-width="2" rx="6"/><rect x="326" y="174.8" width="78" height="24.2" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="365.0" y="191.875" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">G</text><text x="365.0" y="222" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">Disk 3</text><text x="365.0" y="240" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5068">18% full</text><rect x="470" y="50" width="90" height="150" fill="none" stroke="#7d86a8" stroke-width="2" rx="6"/><text x="515.0" y="222" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">Disk 4</text><text x="515.0" y="240" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5068">0% full</text><rect x="20" y="310" width="90" height="150" fill="none" stroke="#7d86a8" stroke-width="2" rx="6"/><rect x="26" y="423.5" width="78" height="35.5" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="65.0" y="446.25" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">A</text><rect x="26" y="397.2" width="78" height="24.2" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="65.0" y