<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Updates · Apps · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<link rel="stylesheet" href="/css/apps.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/app-updates.js" defer></script>
</head>
<body class="page-other-services with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page">
  <div class="page-head">
    <div class="page-head__text">
      <h1>Updates</h1>
      <p class="page-head__summary" id="updates-summary">Loading your apps…</p>
      <p class="small muted">Your apps' new versions, to update together. Everything else (Starboard, Reelix, plug-ins, Jellyfin's plug-ins) and what updates by itself is in <a href="/settings-updates.html">Settings, Updates</a>.</p>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="check-updates" disabled><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-refresh-cw"/></svg><span>Check</span></button>
      <button type="button" class="btn btn--primary" id="update-all" disabled><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-download"/></svg><span>Update all</span></button>
    </div>
  </div>
  <div id="updates-notice"></div>
  <div id="updates"></div>
  <div class="selection-bar" id="updates-chosen" role="region" aria-label="Chosen updates" hidden>
    <span class="selection-bar__text" id="updates-chosen-text" aria-live="polite">0 chosen</span>
    <button type="button" class="btn" id="update-chosen" disabled><svg class="i" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#i-download"/></svg><span>Update chosen</span></button>
    <button type="button" class="btn btn--quiet" id="clear-chosen">Clear</button>
  </div>
  <details class="disclosure" id="updates-log" hidden>
    <summary>What the last update did</summary>
    <div class="disclosure__body"><pre class="code-block" id="updates-log-text"></pre></div>
  </details>
</div>
</main>
</body>
</html>
