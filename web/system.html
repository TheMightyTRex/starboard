<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Overview · System · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/designs.css">
<link rel="stylesheet" href="/css/system.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/charts.js" defer></script>
<script src="/js/system.js" defer></script>
</head>
<body class="page-system with-rail">
<!-- shell:start (filled in by starboard/shell.py; edit the menus there) -->
<!-- shell:end -->
<main id="main" tabindex="-1">
<div class="page">
  <div class="page-head">
    <div class="page-head__text">
      <h1>Overview</h1>
      <p class="page-head__summary" id="system-summary">Loading</p>
    </div>
    <div class="actions"><button type="button" class="btn" id="refresh"></button></div>
  </div>
  <div id="recovery"></div>
  <div class="stats" id="stats" aria-live="off"></div>
  <section class="panel" id="health-panel" aria-labelledby="health-title" aria-busy="true">
    <div class="panel__head"><h2 id="health-title">Needs attention</h2><span class="small muted">Warnings your apps and disks report about themselves</span></div>
    <div id="health"></div>
  </section>
  <section class="panel" id="jellyfin-panel" aria-labelledby="jellyfin-title" hidden>
    <div class="panel__head"><div class="title-status"><h2 id="jellyfin-title">Jellyfin</h2><span class="title-status__chips" id="jellyfin-state"></span></div><span class="small muted" id="jellyfin-sub"></span></div>
    <div id="jellyfin-restart" hidden></div>
    <div class="stack-4" id="jellyfin"></div>
  </section>
  <section class="panel" id="jobs-panel" aria-labelledby="jobs-title" hidden>
    <div class="panel__head"><h2 id="jobs-title">Server jobs</h2><span class="small muted">Jobs that run on the server itself, such as a check of every app and service</span></div>
    <ul class="rows" id="jobs"></ul>
  </section>
  <div class="sys-bar" id="range-row"><h2 id="range-title">Last hour</h2></div>
  <div class="sys-charts" id="charts"></div>
</div>
</main>
</body>
</html>
