<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Set up · Starboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#323a77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/components.js" data-manual></script>
<script src="/js/common.js"></script>
<script src="/js/login.js" defer></script>
</head>
<body class="auth-page">
<main id="main">
<section class="panel auth-card" aria-labelledby="auth-title">
  <div class="panel__head">
    <h1 id="auth-title">Set up Starboard</h1>
    <p class="hint">Name your dashboard and choose its password. The setup code is in the installer's output, or run <code>docker compose logs starboard</code>.</p>
  </div>
  <form id="login-form" class="stack" data-mode="setup">
    <div class="field"><label for="site-name">Name your dashboard</label><input class="input" id="site-name" name="site_name" maxlength="60" required aria-describedby="site-name-hint"><p class="hint" id="site-name-hint">Shown in the header and the browser tab. You can change it later in Settings, General.</p></div>
    <div class="field"><label for="token">Setup code</label><input class="input" id="token" name="token" autocomplete="off" required autofocus></div>
    <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="10" required aria-describedby="password-hint"><p class="hint" id="password-hint">At least 10 characters. A short sentence is easy to remember.</p></div>
    <div class="field"><label for="confirm">Type the password again</label><input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" required></div>
    <label class="check" for="remember"><input type="checkbox" id="remember" name="remember"> Remember me on this device</label>
    <p class="field-error" id="auth-error" role="alert"></p>
    <button class="btn btn--primary" type="submit">Save password and continue</button>
  </form>
</section>
</main>
</body>
</html>
