# Starboard. Settings, sessions and API keys live in ./data (never in the repository).
# Copy example.env to .env and change the values there.
#
# Host networking lets Starboard choose who can connect: everyone on your home network, or this computer only
# (Settings, Security). It also reaches your other apps on their published ports, such as http://127.0.0.1:8989.
# Host networking needs Docker on Linux.
services:
  starboard:
    build: .
    image: starboard:local
    container_name: starboard
    user: "${STARBOARD_UID:-10001}:${STARBOARD_GID:-10001}"
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ:-Etc/UTC}
      - STARBOARD_PORT=${STARBOARD_PORT:-8095}
      - STARBOARD_NETWORK=${STARBOARD_NETWORK:-1}
      - STARBOARD_NAME=${STARBOARD_NAME:-}
      - STARBOARD_REPO=${STARBOARD_REPO:-}
      - STARBOARD_DISKS=${STARBOARD_DISKS:-}
      - STARBOARD_SMART_DIR=${STARBOARD_SMART_DIR:-}
      - STARBOARD_POOL_DIR=${STARBOARD_POOL_DIR:-}
      - STARBOARD_JOBS_DIR=${STARBOARD_JOBS_DIR:-}
      - STARBOARD_BACKUP_DIR=${STARBOARD_BACKUP_DIR:-}
      - STARBOARD_CGROUP=${STARBOARD_CGROUP:-}
      - STARBOARD_IPTV_DIR=${STARBOARD_IPTV_DIR:-}
      - STARBOARD_GRAPHICS_VENDOR=${STARBOARD_GRAPHICS_VENDOR:-}  # the graphics chip's maker, from the installer
      - STARBOARD_LIVETV_PATH=${STARBOARD_LIVETV_PATH:-}  # the Live TV folder on this computer, for the Live TV plug-in
      - STARBOARD_HOST_HOME=${STARBOARD_HOST_HOME:-}  # your home folder, for folders typed with ~
      - STARBOARD_TRUST_PROXY=${STARBOARD_TRUST_PROXY:-0}
      - STARBOARD_PROXY_ADDRESSES=${STARBOARD_PROXY_ADDRESSES:-}
      - STARBOARD_ALLOWED_HOSTS=${STARBOARD_ALLOWED_HOSTS:-}
      - STARBOARD_STORYARR_IMAGE=${STARBOARD_STORYARR_IMAGE:-}
    volumes:
      - ./data:/data
      # Your own folders (Storage, Disk health) go in compose.override.yaml, which updates leave alone.
    # Limits, so a fault cannot take the whole server's memory or processes. Starboard uses 15 to 40 MB; reading a
    # large watch history takes the most (an 80 MB file, the largest accepted, about 400 MB).
    mem_limit: 512m
    pids_limit: 200
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Docker's own copy of the log holds only start-up and problems (Starboard's full log is on System, Logs, where
    # Settings decides how long it is kept). Capped at 3 files of 1 MB, so it can never grow large.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
