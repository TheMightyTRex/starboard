# Starboard. Settings, sessions and API keys live in ./data (never in the repository).
# Copy example.env to .env and change the values there.
#
# Host networking lets Starboard choose who can connect: everyone on your home network, or this computer only
# (Settings, Security). It also reaches your other apps on their published ports, such as http://127.0.0.1:8989.
# Host networking needs Docker on Linux.
services:
  starboard:
    build: .
    image: starboard:local
    container_name: starboard
    user: "${STARBOARD_UID:-10001}:${STARBOARD_GID:-10001}"
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ:-Etc/UTC}
      - STARBOARD_PORT=${STARBOARD_PORT:-8095}
      - STARBOARD_NETWORK=${STARBOARD_NETWORK:-1}
      - STARBOARD_NAME=${STARBOARD_NAME:-}
      - STARBOARD_REPO=${STARBOARD_REPO:-}
      - STARBOARD_DISKS=${STARBOARD_DISKS:-}
      - STARBOARD_TRUST_PROXY=${STARBOARD_TRUST_PROXY:-0}
    volumes:
      - ./data:/data
      # Free space on the System page: mount each folder read-only and list it in STARBOARD_DISKS.
      # - /mnt/media:/disks/media:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
