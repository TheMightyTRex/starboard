<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" aria-labelledby="t d"><title id="t">Text size and wider text spacing</title><desc id="d">Text size: the same line, Harbour Lights, film, 2023, in your library, shown at 100%, 125%, 150% and 175%, each larger than the last. Wider text spacing: a sentence with normal spacing beside the same sentence with more space between lines, letters and words, so it takes three lines instead of two.</desc><style>
.bg{fill:#ffffff}.ink{fill:#1d2238}.mut{fill:#4a5068}.box{fill:#eef2fb;stroke:#7d86a8;stroke-width:2}
.hi{fill:#ffffff;stroke:#0b5f5a;stroke-width:3}.acc{fill:#0b5f5a}.line{stroke:#4a5068;stroke-width:2.5;fill:none}
.head{fill:#dfe6f5;stroke:#7d86a8;stroke-width:2}.warn{fill:#fff4dc;stroke:#8a5a00;stroke-width:2}
.out{fill:#f4f4f6;stroke:#7d86a8;stroke-width:2;stroke-dasharray:7 5}.tick{fill:#0b5f5a}
@media (prefers-color-scheme: dark){
.bg{fill:#101827}.ink{fill:#f3f4f6}.mut{fill:#b8c1d3}.box{fill:#1b2537;stroke:#8390a8}
.hi{fill:#101827;stroke:#5ed3c6}.acc{fill:#5ed3c6}.line{stroke:#b8c1d3}.head{fill:#232f42;stroke:#8390a8}
.warn{fill:#3a2c09;stroke:#f6cf6b}.out{fill:#161e2c;stroke:#8390a8}.tick{fill:#5ed3c6}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker></defs><rect class="bg" width="1100" height="430"/><g font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif"><text x="20" y="34" font-size="19" font-weight="700" class="ink" text-anchor="start">Text size: the same words at each setting</text><text x="20" y="80" font-size="15" font-weight="700" class="mut" text-anchor="start">100%</text><text x="110" y="80" font-size="16" font-weight="400" class="ink" text-anchor="start">Harbour Lights, film, 2023, in your library</text><text x="20" y="122" font-size="15" font-weight="700" class="mut" text-anchor="start">125%</text><text x="110" y="122" font-size="20" font-weight="400" class="ink" text-anchor="start">Harbour Lights, film, 2023, in your library</text><text x="20" y="168" font-size="15" font-weight="700" class="mut" text-anchor="start">150%</text><text x="110" y="168" font-size="24" font-weight="400" class="ink" text-anchor="start">Harbour Lights, film, 2023, in your library</text><text x="20" y="218" font-size="15" font-weight="700" class="mut" text-anchor="start">175%</text><text x="110" y="218" font-size="28" font-weight="400" class="ink" text-anchor="start">Harbour Lights, film, 2023, in your library</text><path d="M20,266 L1080,266" class="line" stroke-width="1" opacity="0.4"/><text x="20" y="302" font-size="19" font-weight="700" class="ink" text-anchor="start">Wider text spacing</text><text x="20" y="342" font-size="15" font-weight="700" class="mut" text-anchor="start">Deactivated</text><text x="170" y="342" font-size="16" font-weight="400" class="ink" text-anchor="start">Starboard checks your apps every minute</text><text x="170" y="366" font-size="16" font-weight="400" class="ink" text-anchor="start">and tells you when one stops answering.</text><text x="600" y="342" font-size="15" font-weight="700" class="mut" text-anchor="start">Activated</text><text x="720" y="342" font-size="16" font-weight="400" class="ink" text-anchor="start" letter-spacing="1.9" word-spacing="2.6">Starboard checks your apps</text><text x="720" y="371" font-size="16" font-weight="400" class="ink" text-anchor="start" letter-spacing="1.9" word-spacing="2.6">every minute and tells you</text><text x="720" y="400" font-size="16" font-weight="400" class="ink" text-anchor="start" letter-spacing="1.9" word-spacing="2.6">when one stops answering.</text></g></svg>
