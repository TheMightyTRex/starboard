<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="t d"><title id="t">How Starboard is tested for accessibility</title><desc id="d">Three bands. Every change, before it is merged: Scan: axe-core 4.14.0, WCAG 2.2 AA, every page in Light, Dark and High contrast; structure, target size, reflow, forced colours, reduced motion. Latest result: 0 problems on 101 pages; Reading order: What a screen reader reads against what is seen, Tab order, landmarks and the h1 first, on every page. Latest result: 0 problems; Keyboard walk: The main tasks with keys only: focus after each step, and what is said. Latest result: 76 of 76 checks passed; Colour contrast: Every colour pair in the design system, in every theme and palette. Latest result: 560 pairs, 0 failures. Before every release: all the checks run again with the journeys and fresh screenshots that a person looks at. Still needs a person, not done yet: listening with a screen reader such as Orca or NVDA, and testing with people who use assistive technology. Results from the run on 14 November 2026.</desc><style>
.bg{fill:#ffffff}.ink{fill:#1d2238}.mut{fill:#4a5068}.box{fill:#eef2fb;stroke:#7d86a8;stroke-width:2}
.hi{fill:#ffffff;stroke:#0b5f5a;stroke-width:3}.acc{fill:#0b5f5a}.line{stroke:#4a5068;stroke-width:2.5;fill:none}
.head{fill:#dfe6f5;stroke:#7d86a8;stroke-width:2}.warn{fill:#fff4dc;stroke:#8a5a00;stroke-width:2}
.out{fill:#f4f4f6;stroke:#7d86a8;stroke-width:2;stroke-dasharray:7 5}.tick{fill:#0b5f5a}
@media (prefers-color-scheme: dark){
.bg{fill:#101827}.ink{fill:#f3f4f6}.mut{fill:#b8c1d3}.box{fill:#1b2537;stroke:#8390a8}
.hi{fill:#101827;stroke:#5ed3c6}.acc{fill:#5ed3c6}.line{stroke:#b8c1d3}.head{fill:#232f42;stroke:#8390a8}
.warn{fill:#3a2c09;stroke:#f6cf6b}.out{fill:#161e2c;stroke:#8390a8}.tick{fill:#5ed3c6}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker></defs><rect class="bg" width="1100" height="640"/><g font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif"><text x="20" y="34" font-size="19" font-weight="700" class="ink" text-anchor="start">How Starboard is tested for accessibility</text><rect x="20" y="56" width="1060" height="250" rx="12" class="box"/><text x="40" y="86" font-size="17" font-weight="700" class="ink" text-anchor="start">Every change, before it is merged</text><text x="1060" y="86" font-size="14" font-weight="400" class="mut" text-anchor="end">tools/a11y.sh, run three ways</text><rect x="40" y="100" width="245" height="190" rx="10" class="hi"/><text x="54" y="128" font-size="16" font-weight="700" class="ink" text-anchor="start">Scan</text><text x="54" y="154" font-size="13" font-weight="400" class="ink" text-anchor="start">axe-core 4.14.0, WCAG 2.2</text><text x="54" y="172" font-size="13" font-weight="400" class="ink" text-anchor="start">AA, every page in Light,</text><text x="54" y="190" font-size="13" font-weight="400" class="ink" text-anchor="start">Dark and High contrast;</text><text x="54" y="208" font-size="13" font-weight="400" class="ink" text-anchor="start">structure, target size,</text><text x="54" y="226" font-size="13" font-weight="400" class="ink" text-anchor="start">reflow, forced colours,</text><text x="54" y="244" font-size="13" font-weight="400" class="ink" text-anchor="start">reduced motion</text><text x="54" y="274" font-size="14" font-weight="700" class="acc" text-anchor="start">0 problems on 101 pages</text><rect x="297" y="100" width="245" height="190" rx="10" class="hi"/><text x="311" y="128" font-size="16" font-weight="700" class="ink" text-anchor="start">Reading order</text><text x="311" y="154" font-size="13" font-weight="400" class="ink" text-anchor="start">What a screen reader reads</text><text x="311" y="172" font-size="13" font-weight="400" class="ink" text-anchor="start">against what is seen, Tab</text><text x="311" y="190" font-size="13" font-weight="400" class="ink" text-anchor="start">order, landmarks and the h1</text><text x="311" y="208" font-size="13" font-weight="400" class="ink" text-anchor="start">first, on every page</text><text x="311" y="274" font-size="14" font-weight="700" class="acc" text-anchor="start">0 problems</text><rect x="554" y="100" width="245" height="190" rx="10" class="hi"/><text x="568" y="128" font-size="16" font-weight="700" class="ink" text-anchor="start">Keyboard walk</text><text x="568" y="154" font-size="13" font-weight="400" class="ink" text-anchor="start">The main tasks with keys</text><text x="568" y="172" font-size="13" font-weight="400" class="ink" text-anchor="start">only: focus after each step,</text><text x="568" y="190" font-size="13" font-weight="400" class="ink" text-anchor="start">and what is said</text><text x="568" y="274" font-size="14" font-weight="700" class="acc" text-anchor="start">76 of 76 checks passed</text><rect x="811" y="100" width="245" height="190" rx="10" class="hi"/><text x="825" y="128" font-size="16" font-weight="700" class="ink" text-anchor="start">Colour contrast</text><text x="825" y="154" font-size="13" font-weight="400" class="ink" text-anchor="start">Every colour pair in the</text><text x="825" y="172" font-size="13" font-weight="400" class="ink" text-anchor="start">design system, in every</text><text x="825" y="190" font-size="13" font-weight="400" class="ink" text-anchor="start">theme and palette</text><text x="825" y="274" font-size="14" font-weight="700" class="acc" text-anchor="start">560 pairs, 0 failures</text><rect x="20" y="326" width="1060" height="120" rx="12" class="box"/><text x="40" y="356" font-size="17" font-weight="700" class="ink" text-anchor="start">Before every release</text><text x="1060" y="356" font-size="14" font-weight="400" class="mut" text-anchor="end">as well as all of the above</text><text x="40" y="384" font-size="15" font-weight="400" class="ink" text-anchor="start">All the checks run again on the release, with the journeys (every page used as a person would) and fresh</text><text x="40" y="405" font-size="15" font-weight="400" class="ink" text-anchor="start">screenshots that a person looks at.</text><rect x="20" y="466" width="1060" height="130" rx="12" class="warn"/><text x="40" y="496" font-size="17" font-weight="700" class="ink" text-anchor="start">Still needs a person</text><text x="1060" y="496" font-size="14" font-weight="400" class="mut" text-anchor="end">not done yet</text><text x="40" y="524" font-size="15" font-weight="400" class="ink" text-anchor="start">Listening with a screen reader, such as Orca or NVDA, and testing with people who use assistive technology.</text><text x="40" y="545" font-size="15" font-weight="400" class="ink" text-anchor="start">Tools find many problems, but not whether something makes sense when heard.</text><text x="20" y="624" font-size="14" font-weight="400" class="mut" text-anchor="start">Results from the run on 14 November 2026.</text></g></svg>
