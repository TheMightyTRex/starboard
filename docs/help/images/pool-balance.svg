<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 300" width="1260" height="300" role="img" aria-labelledby="t d"><title id="t">Balancing the files across the drives in a pool</title><desc id="d">Before: disk 1 is 85% full with folders A, B, C and D, disk 2 is 48% full, disk 3 is 18% full and disk 4 is empty. After: folder B has moved to disk 4 and folder C to disk 3, so each disk is between 22% and 48% full, and every folder is still whole on one drive.</desc><rect width="1260" height="300" fill="#ffffff"/><g font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" fill="#1d2238"><text x="20" y="30" font-size="18" font-weight="700" text-anchor="start" fill="#1d2238">Before balancing</text><text x="660" y="30" font-size="18" font-weight="700" text-anchor="start" fill="#1d2238">After balancing</text><rect x="20" y="60" width="90" height="150" fill="none" stroke="#7d86a8" stroke-width="2" rx="6"/><rect x="26" y="173.5" width="78" height="35.5" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="65.0" y="196.25" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">A</text><rect x="26" y="139.8" width="78" height="31.8" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="65.0" y="160.625" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">B</text><rect x="26" y="109.8" width="78" height="28.0" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="65.0" y="128.75" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">C</text><rect x="26" y="83.5" width="78" height="24.2" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="65.0" y="100.625" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">D</text><text x="65.0" y="232" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">Disk 1</text><text x="65.0" y="250" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5068">85% full</text><re