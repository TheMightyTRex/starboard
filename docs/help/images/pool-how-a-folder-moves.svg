<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 195" width="1220" height="195" role="img" aria-labelledby="t d"><title id="t">How one folder is moved</title><desc id="d">Each folder is copied to the emptier drive, the copy is checked against the original, and only then is the original removed. The pool shows the folder in the same place throughout.</desc><rect width="1220" height="195" fill="#ffffff"/><g font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" fill="#1d2238"><rect x="20" y="20" width="270" height="120" rx="10" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5"/><text x="36" y="52" font-size="17" font-weight="700" text-anchor="start" fill="#1d2238">1. Copy</text><text x="36" y="80" font-size="14" font-weight="400" text-anchor="start" fill="#1d2238">The folder is copied to the</text><text x="36" y="100" font-size="14" font-weight="400" text-anchor="start" fill="#1d2238">emptier drive, under the pool.</text><path d="M 294 80 l 22 0 m -8 -8 l 8 8 l -8 8" stroke="#1d2238" stroke-width="3" fill="none"/><rect x="320" y="20" width="270" height="120" rx="10" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5"/><text x="336" y="52" font-size="17" font-weight="700" text-anchor="start" fill="#1d2238">2. Check</text><text x="336" y="80" font-size="14" font-weight="400" text-anchor="start" fill="#1d2238">rsync compares the copy with</text><text x="336" y="100" font-size="14" font-weight="400" text-anchor="start" fill="#1d2238">the original, file by file.</text><path d="M 594 80 l 22 0 m -8 -8 l 8 8 l -8 8" stroke="#1d2238" stroke-width="3" fill="none"/><rect x="620" y="20" width="270" height="120" rx="10" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5"/><text x="636" y="52" font-size="17" font-weight="700" text-anchor="start" fill="#1d2238">3. Remove</text><text x="636" y="80" font-size="14" font-weight="400" text-anchor="start" fill="#1d2238">Only when they match is the</text><text x="636" y="100" font-size="14" font-weight="400" text-anchor="start" fill="#1d2238">original removed.</text><rect x="920" y="20" width="270" height="120" rx="10" fill="#ffffff" stroke="#1d2238" stroke-width="1.5"/><text x="936" y="52" font-size="17" font-weight="700" text-anchor="start" fill="#1d2238">Throughout</text><text x="936" y="80" font-size="14" font-weight="400" text-anchor="start" fill="#1d2238">The pool shows the folder in</text><text x="936" y="100" font-size="14" font-weight="400" text-anchor="start" fill="#1d2238">the same place, so the apps</text><text x="936" y="120" font-size="14" font-weight="400" text-anchor="start" fill="#1d2238">notice nothing.</text><text x="20" y="175" font-size="14" font-weight="400" text-anchor="start" fill="#1d2238">If it is stopped, or the power goes off, the folder is still whole on the drive it came from.</text></g></svg>
