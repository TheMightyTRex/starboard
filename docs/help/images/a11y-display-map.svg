<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" role="img" aria-labelledby="t d"><title id="t">Where Display is, and what each setting changes</title><desc id="d">The Display button is the last item in the header of every Starboard page. Selecting it opens the Display and accessibility panel. Theme: Match device, Light, Dark. The colours: dark text on light, or light text on dark. Match device follows your phone or computer. Text size: 100%, 125%, 150%, 175%. All of Starboard's text, with the layout reflowing to fit. Controls grow with it. Reduce motion: Match device, On, Off. Slide-outs and menus appear without sliding, the loading line fades, long lists wait for Show more. High contrast: Activated or deactivated. Near-black or white text, solid borders and no shadows, and a bolder focus colour. Underline links: Activated or deactivated. Every link is underlined, so it is not shown by colour alone. Wider text spacing: Activated or deactivated. More space between lines (1.8), letters (0.12 em) and words (0.16 em). Style: Only with a style plug-in. Colours and corners from a plug-in, checked for contrast. Your choices above always win. Design: Five designs, or the default. How the Apps page is laid out in this browser. Done and Reset: Buttons at the end. Done closes the panel. Reset puts every choice back to the defaults. Every choice applies at once and is kept in this browser only.</desc><style>
.bg{fill:#ffffff}.ink{fill:#1d2238}.mut{fill:#4a5068}.box{fill:#eef2fb;stroke:#7d86a8;stroke-width:2}
.hi{fill:#ffffff;stroke:#0b5f5a;stroke-width:3}.acc{fill:#0b5f5a}.line{stroke:#4a5068;stroke-width:2.5;fill:none}
.head{fill:#dfe6f5;stroke:#7d86a8;stroke-width:2}.warn{fill:#fff4dc;stroke:#8a5a00;stroke-width:2}
.out{fill:#f4f4f6;stroke:#7d86a8;stroke-width:2;stroke-dasharray:7 5}.tick{fill:#0b5f5a}
@media (prefers-color-scheme: dark){
.bg{fill:#101827}.ink{fill:#f3f4f6}.mut{fill:#b8c1d3}.box{fill:#1b2537;stroke:#8390a8}
.hi{fill:#101827;stroke:#5ed3c6}.acc{fill:#5ed3c6}.line{stroke:#b8c1d3}.head{fill:#232f42;stroke:#8390a8}
.warn{fill:#3a2c09;stroke:#f6cf6b}.out{fill:#161e2c;stroke:#8390a8}.tick{fill:#5ed3c6}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker></defs><rect class="bg" width="1100" height="760"/><g font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif"><rect x="20" y="20" width="1060" height="58" rx="10" class="head"/><text x="44" y="56" font-size="18" font-weight="700" class="ink" text-anchor="start">Starboard</text><rect x="210" y="34" width="420" height="30" rx="6" class="box"/><text x="226" y="55" font-size="14" font-weight="400" class="mut" text-anchor="start">Search films, series, music and books</text><text x="860" y="56" font-size="15" font-weight="700" class="ink" text-anchor="start">Help</text><rect x="950" y="30" width="112" height="38" rx="8" class="hi"/><text x="1006" y="55" font-size="16" font-weight="700" class="ink" text-anchor="middle">Display</text><text x="40" y="104" font-size="14" font-weight="400" class="mut" text-anchor="start">The header of every page</text><path d="M1006,68 L1006,116" class="line" marker-end="url(#a)"/><text x="990" y="100" font-size="14" font-weight="700" class="ink" text-anchor="end">Select Display</text><rect x="20" y="122" width="1060" height="600" rx="10" class="box"/><rect x="20" y="122" width="1060" height="46" rx="10" class="head"/><text x="40" y="152" font-size="18" font-weight="700" class="ink" text-anchor="start">Display and accessibility</text><text x="1050" y="152" font-size="14" font-weight="700" class="ink" text-anchor="end">Close</text><text x="40" y="194" font-size="14" font-weight="700" class="mut" text-anchor="start">Setting</text><text x="250" y="194" font-size="14" font-weight="700" class="mut" text-anchor="start">Choices</text><text x="500" y="194" font-size="14" font-weight="700" class="mut" text-anchor="start">What it changes</text><path d="M36,202 L1064,202" class="line" stroke-width="1" opacity="0.35"/><text x="40" y="226" font-size="15" font-weight="700" class="ink" text-anchor="start">Theme</text><text x="250" y="226" font-size="14" font-weight="400" class="mut" text-anchor="start">Match device, Light, Dark</text><text x="500" y="226" font-size="14" font-weight="400" class="ink" text-anchor="start">The colours: dark text on light, or light text on dark. Match</text><text x="500" y="245" font-size="14" font-weight="400" class="ink" text-anchor="start">device follows your phone or computer.</text><path d="M36,256 L1064,256" class="line" stroke-width="1" opacity="0.35"/><text x="40" y="280" font-size="15" font-weight="700" class="ink" text-anchor="start">Text size</text><text x="250" y="280" font-size="14" font-weight="400" class="mut" text-anchor="start">100%, 125%, 150%, 175%</text><text x="500" y="280" font-size="14" font-weight="400" class="ink" text-anchor="start">All of Starboard's text, with the layout reflowing to fit.</text><text x="500" y="299" font-size="14" font-weight="400" class="ink" text-anchor="start">Controls grow with it.</text><path d="M36,310 L1064,310" class="line" stroke-width="1" opacity="0.35"/><text x="40" y="334" font-size="15" font-weight="700" class="ink" text-anchor="start">Reduce motion</text><text x="250" y="334" font-size="14" font-weight="400" class="mut" text-anchor="start">Match device, On, Off</text><text x="500" y="334" font-size="14" font-weight="400" class="ink" text-anchor="start">Slide-outs and menus appear without sliding, the loading line</text><text x="500" y="353" font-size="14" font-weight="400" class="ink" text-anchor="start">fades, long lists wait for Show more.</text><path d="M36,364 L1064,364" class="line" stroke-width="1" opacity="0.35"/><text x="40" y="388" font-size="15" font-weight="700" class="ink" text-anchor="start">High contrast</text><text x="250" y="388" font-size="14" font-weight="400" class="mut" text-anchor="start">Activated or deactivated</text><text x="500" y="388" font-size="14" font-weight="400" class="ink" text-anchor="start">Near-black or white text, solid borders and no shadows, and a</text><text x="500" y="407" font-size="14" font-weight="400" class="ink" text-anchor="start">bolder focus colour.</text><path d="M36,418 L1064,418" class="line" stroke-width="1" opacity="0.35"/><text x="40" y="442" font-size="15" font-weight="700" class="ink" text-anchor="start">Underline links</text><text x="250" y="442" font-size="14" font-weight="400" class="mut" text-anchor="start">Activated or deactivated</text><text x="500" y="442" font-size="14" font-weight="400" class="ink" text-anchor="start">Every link is underlined, so it is not shown by colour alone.</text><path d="M36,472 L1064,472" class="line" stroke-width="1" opacity="0.35"/><text x="40" y="496" font-size="15" font-weight="700" class="ink" text-anchor="start">Wider text spacing</text><text x="250" y="496" font-size="14" font-weight="400" class="mut" text-anchor="start">Activated or deactivated</text><text x="500" y="496" font-size="14" font-weight="400" class="ink" text-anchor="start">More space between lines (1.8), letters (0.12 em) and words</text><text x="500" y="515" font-size="14" font-weight="400" class="ink" text-anchor="start">(0.16 em).</text><path d="M36,526 L1064,526" class="line" stroke-width="1" opacity="0.35"/><text x="40" y="550" font-size="15" font-weight="700" class="ink" text-anchor="start">Style</text><text x="250" y="550" font-size="14" font-weight="400" class="mut" text-anchor="start">Only with a style plug-in</text><text x="500" y="550" font-size="14" font-weight="400" class="ink" text-anchor="start">Colours and corners from a plug-in, checked for contrast. Your</text><text x="500" y="569" font-size="14" font-weight="400" class="ink" text-anchor="start">choices above always win.</text><path d="M36,580 L1064,580" class="line" stroke-width="1" opacity="0.35"/><text x="40" y="604" font-size="15" font-weight="700" class="ink" text-anchor="start">Design</text><text x="250" y="604" font-size="14" font-weight="400" class="mut" text-anchor="start">Five designs, or the</text><text x="250" y="623" font-size="14" font-weight="400" class="mut" text-anchor="start">default</text><text x="500" y="604" font-size="14" font-weight="400" class="ink" text-anchor="start">How the Apps page is laid out in this browser.</text><path d="M36,634 L1064,634" class="line" stroke-width="1" opacity="0.35"/><text x="40" y="658" font-size="15" font-weight="700" class="ink" text-anchor="start">Done and Reset</text><text x="250" y="658" font-size="14" font-weight="400" class="mut" text-anchor="start">Buttons at the end</text><text x="500" y="658" font-size="14" font-weight="400" class="ink" text-anchor="start">Done closes the panel. Reset puts every choice back to the</text><text x="500" y="677" font-size="14" font-weight="400" class="ink" text-anchor="start">defaults.</text><text x="40" y="742" font-size="15" font-weight="700" class="ink" text-anchor="start">Every choice applies at once and is kept in this browser only, for this phone or computer.</text></g></svg>
