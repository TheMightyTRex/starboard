<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" aria-labelledby="t d"><title id="t">What Starboard controls, and what it does not</title><desc id="d">Starboard's own pages, built and tested to wcag 2.2 aa: Apps, Home, Library, Discover, Activity, System, Settings, Sign in and the set-up, Display and accessibility. Made by others, drawn by Starboard, checked, but written by someone else: Plug-in styles: contrast checked, Plug-in cards and settings: labels checked, drawn by Starboard, Words and pictures plug-ins send. Outside Starboard, starboard cannot change or test these: Jellyfin, Audiobookshelf, players, Reelix's own pages, Other apps' own pages, Your browser and screen reader.</desc><style>
.bg{fill:#ffffff}.ink{fill:#1d2238}.mut{fill:#4a5068}.box{fill:#eef2fb;stroke:#7d86a8;stroke-width:2}
.hi{fill:#ffffff;stroke:#0b5f5a;stroke-width:3}.acc{fill:#0b5f5a}.line{stroke:#4a5068;stroke-width:2.5;fill:none}
.head{fill:#dfe6f5;stroke:#7d86a8;stroke-width:2}.warn{fill:#fff4dc;stroke:#8a5a00;stroke-width:2}
.out{fill:#f4f4f6;stroke:#7d86a8;stroke-width:2;stroke-dasharray:7 5}.tick{fill:#0b5f5a}
@media (prefers-color-scheme: dark){
.bg{fill:#101827}.ink{fill:#f3f4f6}.mut{fill:#b8c1d3}.box{fill:#1b2537;stroke:#8390a8}
.hi{fill:#101827;stroke:#5ed3c6}.acc{fill:#5ed3c6}.line{stroke:#b8c1d3}.head{fill:#232f42;stroke:#8390a8}
.warn{fill:#3a2c09;stroke:#f6cf6b}.out{fill:#161e2c;stroke:#8390a8}.tick{fill:#5ed3c6}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker></defs><rect class="bg" width="1100" height="360"/><g font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif"><text x="20" y="34" font-size="19" font-weight="700" class="ink" text-anchor="start">What Starboard controls, and what it does not</text><rect x="20" y="56" width="340" height="280" rx="12" class="hi"/><text x="38" y="90" font-size="17" font-weight="700" class="ink" text-anchor="start">Starboard's own pages</text><text x="38" y="116" font-size="14" font-weight="400" class="mut" text-anchor="start">Built and tested to WCAG 2.2 AA</text><text x="38" y="160" font-size="15" font-weight="400" class="ink" text-anchor="start">Apps, Home, Library, Discover</text><text x="38" y="200" font-size="15" font-weight="400" class="ink" text-anchor="start">Activity, System, Settings</text><text x="38" y="240" font-size="15" font-weight="400" class="ink" text-anchor="start">Sign in and the set-up</text><text x="38" y="280" font-size="15" font-weight="400" class="ink" text-anchor="start">Display and accessibility</text><rect x="380" y="56" width="340" height="280" rx="12" class="box"/><text x="398" y="90" font-size="17" font-weight="700" class="ink" text-anchor="start">Made by others, drawn by Starboard</text><text x="398" y="116" font-size="14" font-weight="400" class="mut" text-anchor="start">Checked, but written by someone else</text><text x="398" y="160" font-size="15" font-weight="400" class="ink" text-anchor="start">Plug-in styles: contrast checked</text><text x="398" y="200" font-size="15" font-weight="400" class="ink" text-anchor="start">Plug-in cards and settings:</text><text x="398" y="240" font-size="15" font-weight="400" class="ink" text-anchor="start">labels checked, drawn by Starboard</text><text x="398" y="280" font-size="15" font-weight="400" class="ink" text-anchor="start">Words and pictures plug-ins send</text><rect x="740" y="56" width="340" height="280" rx="12" class="out"/><text x="758" y="90" font-size="17" font-weight="700" class="ink" text-anchor="start">Outside Starboard</text><text x="758" y="116" font-size="14" font-weight="400" class="mut" text-anchor="start">Starboard cannot change or test these</text><text x="758" y="160" font-size="15" font-weight="400" class="ink" text-anchor="start">Jellyfin, Audiobookshelf, players</text><text x="758" y="200" font-size="15" font-weight="400" class="ink" text-anchor="start">Reelix's own pages</text><text x="758" y="240" font-size="15" font-weight="400" class="ink" text-anchor="start">Other apps' own pages</text><text x="758" y="280" font-size="15" font-weight="400" class="ink" text-anchor="start">Your browser and screen reader</text></g></svg>
