<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 300" width="1290" height="300" role="img" aria-labelledby="t d"><title id="t">What happens without balancing</title><desc id="d">Without balancing, disk 1 stays 95% full and newer episodes of series A land on disks 2 and 3, so one series is spread over three drives. With Starboard's balancer, each series is together on one drive and no drive is near full.</desc><rect width="1290" height="300" fill="#ffffff"/><g font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" fill="#1d2238"><text x="20" y="30" font-size="18" font-weight="700" text-anchor="start" fill="#1d2238">Without balancing</text><text x="660" y="30" font-size="18" font-weight="700" text-anchor="start" fill="#1d2238">With Starboard's balancer</text><rect x="20" y="60" width="90" height="150" fill="none" stroke="#7d86a8" stroke-width="2" rx="6"/><rect x="26" y="151.0" width="78" height="58.0" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="65.0" y="185.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">A</text><rect x="26" y="91.0" width="78" height="58.0" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="65.0" y="125.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">B</text><rect x="26" y="68.5" width="78" height="20.5" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="65.0" y="83.75" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">C</text><text x="65.0" y="232" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">Disk 1</text><text x="65.0" y="250" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5068">95% full</text><rect x="170" y="60" width="90" height="150" fill="none" stroke="#7d86a8" stroke-width="2" rx="6"/><rect x="176" y="188.5" width="78" height="20.5" fill="#f3d9a8" stroke="#1d2238" stroke-width="1.5" stroke-dasharray="5 3" rx="3"/><text x="215.0" y="203.75" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">A+</text><rect x="176" y="169.8" width="78" height="16.8" fill="#f3d9a8" stroke="#1d2238" stroke-width="1.5" stroke-dasharray="5 3" rx="3"/><text x="215.0" y="183.125" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">B+</text><text x="215.0" y="232" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">Disk 2</text><text x="215.0" y="250" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5068">28% full</text><rect x="320" y="60" width="90" height="150" fill="none" stroke="#7d86a8" stroke-width="2" rx="6"/><rect x="326" y="192.2" width="78" height="16.8" fill="#f3d9a8" stroke="#1d2238" stroke-width="1.5" stroke-dasharray="5 3" rx="3"/><text x="365.0" y="205.625" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">A+</text><text x="365.0" y="232" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">Disk 3</text><text x="365.0" y="250" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5068">12% full</text><rect x="660" y="60" width="90" height="150" fill="none" stroke="#7d86a8" stroke-width="2" rx="6"/><rect x="666" y="151.0" width="78" height="58.0" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="705.0" y="185.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">A</text><rect x="666" y="109.8" width="78" height="39.2" fill="#f3d9a8" stroke="#1d2238" stroke-width="1.5" stroke-dasharray="5 3" rx="3"/><text x="705.0" y="134.375" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">A+</text><text x="705.0" y="232" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">Disk 1</text><text x="705.0" y="250" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5068">68% full</text><rect x="810" y="60" width="90" height="150" fill="none" stroke="#7d86a8" stroke-width="2" rx="6"/><rect x="816" y="151.0" width="78" height="58.0" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="855.0" y="185.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">B</text><rect x="816" y="132.2" width="78" height="16.8" fill="#f3d9a8" stroke="#1d2238" stroke-width="1.5" stroke-dasharray="5 3" rx="3"/><text x="855.0" y="145.625" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">B+</text><text x="855.0" y="232" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">Disk 2</text><text x="855.0" y="250" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5068">52% full</text><rect x="960" y="60" width="90" height="150" fill="none" stroke="#7d86a8" stroke-width="2" rx="6"/><rect x="966" y="188.5" width="78" height="20.5" fill="#c9d6f5" stroke="#1d2238" stroke-width="1.5" rx="3"/><text x="1005.0" y="203.75" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">C</text><text x="1005.0" y="232" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2238">Disk 3</text><text x="1005.0" y="250" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5068">15% full</text><text x="470" y="110" font-size="13" font-weight="400" text-anchor="start" fill="#4a5068">New episodes go to</text><text x="470" y="128" font-size="13" font-weight="400" text-anchor="start" fill="#4a5068">the emptiest drive,</text><text x="470" y="146" font-size="13" font-weight="400" text-anchor="start" fill="#4a5068">so series A is spread</text><text x="470" y="164" font-size="13" font-weight="400" text-anchor="start" fill="#4a5068">over three drives.</text><text x="470" y="182" font-size="13" font-weight="400" text-anchor="start" fill="#4a5068">Disk 1 stays 95% full.</text><text x="1110" y="110" font-size="13" font-weight="400" text-anchor="start" fill="#4a5068">Each series is kept</text><text x="1110" y="128" font-size="13" font-weight="400" text-anchor="start" fill="#4a5068">together on one drive,</text><text x="1110" y="146" font-size="13" font-weight="400" text-anchor="start" fill="#4a5068">and no drive is near</text><text x="1110" y="164" font-size="13" font-weight="400" text-anchor="start" fill="#4a5068">full.</text><text x="20" y="280" font-size="14" font-weight="400" text-anchor="start" fill="#1d2238">A+ means newer episodes of series A. If disk 2 failed without balancing, series A and B would each lose some episodes; with balancing, only series B.</text></g></svg>
