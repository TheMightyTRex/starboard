<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-labelledby="t d"><title id="t">How focus moves through a slide-out or a dialog</title><desc id="d">Five steps. 1. You select a button: Such as Display, Edit or Remove. Starboard remembers it as the opener. 2. Focus moves inside: To the first field, to Close, or to Cancel when the choice would delete something. 3. Tab stays inside: Tab and Shift and Tab move only between its controls. After the last, focus goes back to the first. 4. You close it: With Escape, Close, Done or Cancel, or by finishing what it asks. 5. Focus goes back: To the opener. If that has gone, to the same control drawn again, its row, the section's heading or the page's heading. The page behind cannot be reached while the slide-out or dialog is open.</desc><style>
.bg{fill:#ffffff}.ink{fill:#1d2238}.mut{fill:#4a5068}.box{fill:#eef2fb;stroke:#7d86a8;stroke-width:2}
.hi{fill:#ffffff;stroke:#0b5f5a;stroke-width:3}.acc{fill:#0b5f5a}.line{stroke:#4a5068;stroke-width:2.5;fill:none}
.head{fill:#dfe6f5;stroke:#7d86a8;stroke-width:2}.warn{fill:#fff4dc;stroke:#8a5a00;stroke-width:2}
.out{fill:#f4f4f6;stroke:#7d86a8;stroke-width:2;stroke-dasharray:7 5}.tick{fill:#0b5f5a}
@media (prefers-color-scheme: dark){
.bg{fill:#101827}.ink{fill:#f3f4f6}.mut{fill:#b8c1d3}.box{fill:#1b2537;stroke:#8390a8}
.hi{fill:#101827;stroke:#5ed3c6}.acc{fill:#5ed3c6}.line{stroke:#b8c1d3}.head{fill:#232f42;stroke:#8390a8}
.warn{fill:#3a2c09;stroke:#f6cf6b}.out{fill:#161e2c;stroke:#8390a8}.tick{fill:#5ed3c6}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker></defs><rect class="bg" width="1100" height="440"/><g font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif"><text x="20" y="34" font-size="19" font-weight="700" class="ink" text-anchor="start">How focus moves through a slide-out or a dialog</text><rect x="20" y="64" width="196" height="250" rx="10" class="box"/><text x="34" y="96" font-size="16" font-weight="700" class="ink" text-anchor="start">1. You select a</text><text x="34" y="117" font-size="16" font-weight="700" class="ink" text-anchor="start">button</text><text x="34" y="148" font-size="14" font-weight="400" class="ink" text-anchor="start">Such as Display, Edit</text><text x="34" y="168" font-size="14" font-weight="400" class="ink" text-anchor="start">or Remove. Starboard</text><text x="34" y="188" font-size="14" font-weight="400" class="ink" text-anchor="start">remembers it as the</text><text x="34" y="208" font-size="14" font-weight="400" class="ink" text-anchor="start">opener.</text><path d="M218,189.0 L234,189.0" class="line" marker-end="url(#a)"/><rect x="236" y="64" width="196" height="250" rx="10" class="hi"/><text x="250" y="96" font-size="16" font-weight="700" class="ink" text-anchor="start">2. Focus moves</text><text x="250" y="117" font-size="16" font-weight="700" class="ink" text-anchor="start">inside</text><text x="250" y="148" font-size="14" font-weight="400" class="ink" text-anchor="start">To the first field,</text><text x="250" y="168" font-size="14" font-weight="400" class="ink" text-anchor="start">to Close, or to</text><text x="250" y="188" font-size="14" font-weight="400" class="ink" text-anchor="start">Cancel when the</text><text x="250" y="208" font-size="14" font-weight="400" class="ink" text-anchor="start">choice would delete</text><text x="250" y="228" font-size="14" font-weight="400" class="ink" text-anchor="start">something.</text><path d="M434,189.0 L450,189.0" class="line" marker-end="url(#a)"/><rect x="452" y="64" width="196" height="250" rx="10" class="hi"/><text x="466" y="96" font-size="16" font-weight="700" class="ink" text-anchor="start">3. Tab stays inside</text><text x="466" y="148" font-size="14" font-weight="400" class="ink" text-anchor="start">Tab and Shift and Tab</text><text x="466" y="168" font-size="14" font-weight="400" class="ink" text-anchor="start">move only between its</text><text x="466" y="188" font-size="14" font-weight="400" class="ink" text-anchor="start">controls. After the</text><text x="466" y="208" font-size="14" font-weight="400" class="ink" text-anchor="start">last, focus goes back</text><text x="466" y="228" font-size="14" font-weight="400" class="ink" text-anchor="start">to the first.</text><path d="M650,189.0 L666,189.0" class="line" marker-end="url(#a)"/><rect x="668" y="64" width="196" height="250" rx="10" class="box"/><text x="682" y="96" font-size="16" font-weight="700" class="ink" text-anchor="start">4. You close it</text><text x="682" y="148" font-size="14" font-weight="400" class="ink" text-anchor="start">With Escape, Close,</text><text x="682" y="168" font-size="14" font-weight="400" class="ink" text-anchor="start">Done or Cancel, or by</text><text x="682" y="188" font-size="14" font-weight="400" class="ink" text-anchor="start">finishing what it</text><text x="682" y="208" font-size="14" font-weight="400" class="ink" text-anchor="start">asks.</text><path d="M866,189.0 L882,189.0" class="line" marker-end="url(#a)"/><rect x="884" y="64" width="196" height="250" rx="10" class="box"/><text x="898" y="96" font-size="16" font-weight="700" class="ink" text-anchor="start">5. Focus goes back</text><text x="898" y="148" font-size="14" font-weight="400" class="ink" text-anchor="start">To the opener. If</text><text x="898" y="168" font-size="14" font-weight="400" class="ink" text-anchor="start">that has gone, to the</text><text x="898" y="188" font-size="14" font-weight="400" class="ink" text-anchor="start">same control drawn</text><text x="898" y="208" font-size="14" font-weight="400" class="ink" text-anchor="start">again, its row, the</text><text x="898" y="228" font-size="14" font-weight="400" class="ink" text-anchor="start">section's heading or</text><text x="898" y="248" font-size="14" font-weight="400" class="ink" text-anchor="start">the page's heading.</text><path d="M618,314 C618,364 482,364 482,320" class="line" marker-end="url(#a)"/><text x="550.0" y="380" font-size="14" font-weight="700" class="ink" text-anchor="middle">Tab goes round inside</text><text x="20" y="426" font-size="14" font-weight="400" class="mut" text-anchor="start">The page behind cannot be reached while it is open. Outlined boxes: focus is inside the slide-out or dialog.</text></g></svg>
