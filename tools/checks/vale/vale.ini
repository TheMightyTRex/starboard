# Vale checks the writing rules in the content design guide (tools/checks.sh): no em dashes, no contractions,
# British spelling and no Title Case headings. tools/check-help.py checks the help's own rules as well.
StylesPath = styles
MinAlertLevel = error

[*.{md,html}]
BasedOnStyles = Starboard
# Names and quoted text that the rules would otherwise flag: product names, a Debian message and a website's name.
TokenIgnores = (Uptime Kuma), (Playback Reporting), (please insert the disc labeled), (It's FOSS)
